table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - step_order
        - type
        - config
  - role: owner
    permission:
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - step_order
        - type
        - config
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
