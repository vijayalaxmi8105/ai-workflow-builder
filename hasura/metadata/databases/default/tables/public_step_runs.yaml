table:
  name: step_runs
  schema: public
object_relationships:
  - name: app_user
    using:
      foreign_key_constraint_on: approved_by
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
