table:
  name: app_users
  schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: org_members
          schema: public
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: approved_by
        table:
          name: step_runs
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: started_by
        table:
          name: workflow_runs
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: created_by
        table:
          name: workflows
          schema: public
