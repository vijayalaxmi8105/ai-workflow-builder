table:
  name: workflows
  schema: public
object_relationships:
  - name: app_user
    using:
      foreign_key_constraint_on: created_by
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - name
        - org_id
        - created_by
  - role: owner
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - name
        - org_id
        - created_by
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
